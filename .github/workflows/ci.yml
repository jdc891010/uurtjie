# Tests, plus the release checks (versions agree, CHANGELOG section exists), before anything reaches `release`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Release checks
        run: scripts/build-release.sh --check
