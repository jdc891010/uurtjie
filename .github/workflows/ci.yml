# Tests, plus the release checks (versions agree, CHANGELOG section exists), before anything reaches `release`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: App tests
        run: python3 -m unittest discover -s tests -v
      - name: Release tooling tests (unit + security)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Release checks
        run: scripts/build-release.sh --check

  # Mutation testing of the release tooling (scripts/changelog.py, config in setup.cfg). The tests must
  # kill every mutant except the known equivalent ones (MAX_SURVIVORS, listed in setup.cfg).
  mutation:
    runs-on: ubuntu-latest
    env:
      MAX_SURVIVORS: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install mutmut
        run: python3 -m pip install mutmut==3.8.0 pytest
      - name: Run mutations and validate complete results
        run: python3 scripts/check_mutations.py
