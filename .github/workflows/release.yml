# Build with read-only credentials; only publication can modify releases.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP_RELEASES: 3

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Test
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s scripts/tests -v
      - name: Build tarball
        id: build
        shell: bash
        run: scripts/build-release.sh | tail -n1 >> "$GITHUB_OUTPUT"
      - name: Prepare notes
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump the version and add a CHANGELOG.md section."
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "v$VERSION" \
            "uurtjie-$VERSION.tar.gz" uurtjie.tar.gz SHA256SUMS \
            --title "uurtjie $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
      - name: Keep only the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r tag; do
            echo "deleting release $tag (tag kept)"
            gh release delete "$tag" --yes
          done
