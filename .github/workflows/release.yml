# Merging into `release` publishes a GitHub Release: tarball + checksums, notes from CHANGELOG.md.
# Only the newest KEEP_RELEASES releases stay hosted; older ones are deleted (their git tags are kept).
name: release

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP_RELEASES: 3

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # the project's minimum

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build tarball
        id: build
        run: scripts/build-release.sh | tail -n1 >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump the version in uurtjie/__init__.py and omarchy-plugin/jd.uurtjie/manifest.json, and add a CHANGELOG.md section."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "v$VERSION" \
            "dist/uurtjie-$VERSION.tar.gz" dist/uurtjie.tar.gz dist/SHA256SUMS \
            --title "uurtjie $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest

      - name: Keep only the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r tag; do
            echo "deleting release $tag (tag kept)"
            gh release delete "$tag" --yes
          done
