<svg xmlns="http://www.w3.org/2000/svg" width="840" height="378" viewBox="0 0 840 378" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" role="img" aria-label="How uurtjie works: activity inputs feed the daemon, which writes a database read by the bar widget and the CLI">
<style>
  .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d0d7de} .fg{fill:#1f2328} .mute{fill:#59636e}
  .line{stroke:#59636e} .acc{fill:#0969da} .soft{fill:#ddf4ff} .softg{fill:#dafbe1} .softy{fill:#fff8c5}
  .softr{fill:#ffebe9}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d} .fg{fill:#e6edf3} .mute{fill:#9198a1}
    .line{stroke:#9198a1} .acc{fill:#4493f8} .soft{fill:#0c2d6b} .softg{fill:#0f3d1d} .softy{fill:#3b2e0a}
    .softr{fill:#4a1418}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mute"/></marker></defs>
<rect width="840" height="378" rx="12" class="bg"/>
<rect x="20" y="20" width="240" height="70" rx="10" class="card" stroke-width="1.2"/><text x="140.0" y="46" class="fg" font-weight="600" text-anchor="middle">Keyboard / mouse</text><text x="140.0" y="66" class="mute" font-size="12.5" text-anchor="middle">swayidle: are you at the keys?</text><rect x="20" y="104" width="240" height="70" rx="10" class="card" stroke-width="1.2"/><text x="140.0" y="130" class="fg" font-weight="600" text-anchor="middle">Focused window</text><text x="140.0" y="150" class="mute" font-size="12.5" text-anchor="middle">Hyprland: class, title, pid</text><rect x="20" y="188" width="240" height="70" rx="10" class="card" stroke-width="1.2"/><text x="140.0" y="214" class="fg" font-weight="600" text-anchor="middle">Terminal folder</text><text x="140.0" y="234" class="mute" font-size="12.5" text-anchor="middle">Herdr pane or /proc cwd + agent</text><rect x="20" y="272" width="240" height="70" rx="10" class="card" stroke-width="1.2"/><text x="140.0" y="298" class="fg" font-weight="600" text-anchor="middle">Microphone</text><text x="140.0" y="318" class="mute" font-size="12.5" text-anchor="middle">PipeWire: is a call open?</text><line x1="260" y1="55" x2="318" y2="196" class="line" stroke-width="1.6" marker-end="url(#a)"/><line x1="260" y1="139" x2="318" y2="196" class="line" stroke-width="1.6" marker-end="url(#a)"/><line x1="260" y1="223" x2="318" y2="196" class="line" stroke-width="1.6" marker-end="url(#a)"/><line x1="260" y1="307" x2="318" y2="196" class="line" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="20" width="230" height="86" rx="10" class="card" stroke-width="1.2"/><text x="435.0" y="46" class="fg" font-weight="600" text-anchor="middle">config.toml</text><text x="435.0" y="66" class="mute" font-size="12.5" text-anchor="middle">projects: folders, windows,</text><text x="435.0" y="83" class="mute" font-size="12.5" text-anchor="middle">rate, currency</text><line x1="435" y1="106" x2="435" y2="128" class="line" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="130" width="230" height="132" rx="10" class="soft" stroke-width="1.2"/><text x="435.0" y="156" class="fg" font-weight="600" text-anchor="middle">uurtjie daemon</text><text x="435.0" y="176" class="mute" font-size="12.5" text-anchor="middle">one sample every 5 s</text><text x="435.0" y="193" class="mute" font-size="12.5" text-anchor="middle">matches a project by</text><text x="435.0" y="210" class="mute" font-size="12.5" text-anchor="middle">folder or window rule</text><text x="435.0" y="227" class="mute" font-size="12.5" text-anchor="middle">idle 5 min → stops</text><line x1="550" y1="196" x2="608" y2="196" class="line" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="150" width="210" height="92" rx="10" class="card" stroke-width="1.2"/><text x="715.0" y="176" class="fg" font-weight="600" text-anchor="middle">SQLite database</text><text x="715.0" y="196" class="mute" font-size="12.5" text-anchor="middle">entries, timers,</text><text x="715.0" y="213" class="mute" font-size="12.5" text-anchor="middle">invoices, payments</text><line x1="715" y1="150" x2="715" y2="108" class="line" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="20" width="210" height="86" rx="10" class="card" stroke-width="1.2"/><text x="715.0" y="46" class="fg" font-weight="600" text-anchor="middle">Bar widget</text><text x="715.0" y="66" class="mute" font-size="12.5" text-anchor="middle">today, earnings,</text><text x="715.0" y="83" class="mute" font-size="12.5" text-anchor="middle">panel + timer</text><line x1="715" y1="242" x2="715" y2="270" class="line" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="272" width="210" height="86" rx="10" class="card" stroke-width="1.2"/><text x="715.0" y="298" class="fg" font-weight="600" text-anchor="middle">CLI</text><text x="715.0" y="318" class="mute" font-size="12.5" text-anchor="middle">sessions, timesheets,</text><text x="715.0" y="335" class="mute" font-size="12.5" text-anchor="middle">invoices (HTML / PDF)</text>
</svg>
