"178" class="fg" font-weight="600">Sessions</text><rect x="110.0" y="160" width="272.7" height="26" rx="5" class="acc"/><rect x="495.0" y="160" width="128.3" height="26" rx="5" class="acc"/><rect x="719.6" y="160" width="144.4" height="26" rx="5" class="acc"/><text x="246.4" y="178" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">1h25</text><text x="559.2" y="178" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">0h40</text><text x="791.8" y="178" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">0h45</text><line x1="110.0" y1="30" x2="110.0" y2="196" class="line" stroke-opacity=".25" stroke-dasharray="3 4"/><text x="110.0" y="214" class="mute" font-size="12" text-anchor="middle">08:00</text><line x1="302.5" y1="30" x2="302.5" y2="196" class="line" stroke-opacity=".25" stroke-dasharray="3 4"/><text x="302.5" y="214" class="mute" font-size="12" text-anchor="middle">09:00</text><line x1="495.0" y1="30" x2="495.0" y2="196" class="line" stroke-opacity=".25" stroke-dasharray="3 4"/><text x="495.0" y="214" class="mute" font-size="12" text-anchor="middle">10:00</text><line x1="687.5" y1="30" x2="687.5" y2="196" class="line" stroke-opacity=".25" stroke-dasharray="3 4"/><text x="687.5" y="214" class="mute" font-size="12" text-anchor="middle">11:00</text><line x1="880.0" y1="30" x2="880.0" y2="196" class="line" stroke-opacity=".25" stroke-dasharray="3 4"/><text x="880.0" y="214" class="mute" font-size="12" text-anchor="middle">12:00</text><text x="305.7" y="34" class="acc" font-size="13" text-anchor="middle">①</text><text x="389.1" y="94" class="acc" font-size="13" text-anchor="middle">②</text><text x="559.2" y="34" class="acc" font-size="13" text-anchor="middle">③</text><text x="671.5" y="34" class="acc" font-size="13" text-anchor="middle">④</text><text x="20" y="246" class="mute" font-size="13">① A 3-minute switch to Chrome is shorter than sleep_minutes: still one session.</text><text x="20" y="267" class="mute" font-size="13">② After 5 minutes without input (09:30) the entry is cut back to your last keypress at 09:25.</text><text x="20" y="288" class="mute" font-size="13">③ A call counts without typing, because the Acme window has the microphone open.</text><text x="20" y="309" class="mute" font-size="13">④ Windows and folders that match no project, like personal Slack, are never tracked.</text><text x="20" y="330" class="mute" font-size="13">Entries are cut into 15-minute pieces so a crash loses nothing; reports only use sessions.</text><text x="20" y="351" class="fg" font-size="13" font-weight="600">Morning total 2h50 → rounded up to rounding_minutes (6) → 2.9 h × your rate on the invoice.</text>
