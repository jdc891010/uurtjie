<g font-family="'JetBrains Mono','DejaVu Sans Mono','Liberation Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14"><text x="22" y="58" fill="#7ee787" xml:space="preserve">$ <tspan fill="#e6edf3" font-weight="600">uurtjie-timer          # 2nd press of SUPER+ALT+T</tspan></text><text x="22" y="78" fill="#c9d1d9" xml:space="preserve">Stop timer?  acme</text><text x="22" y="98" fill="#c9d1d9" xml:space="preserve">started 14:02 · 0h47</text><text x="22" y="118" fill="#c9d1d9" xml:space="preserve"></text><text x="22" y="138" fill="#c9d1d9" xml:space="preserve">[Enter] stop   [k] keep running   [d] discard</text><text x="22" y="158" fill="#c9d1d9" xml:space="preserve">✓ stopped #812 acme 0h47</text><text x="22" y="178" fill="#c9d1d9" xml:space="preserve"></text><text x="22" y="198" fill="#c9d1d9" xml:space="preserve">[v] speak   or start typing   [Enter] skip</text><text x="22" y="218" fill="#c9d1d9" xml:space="preserve">Description: architecture call with the PM</text></g>
