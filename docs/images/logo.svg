<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">uurtjie: a clock face with only the first hour lit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc777"/>
      <stop offset="1" stop-color="#ff8f40"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

  <!-- the day: a quiet track -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#2f3549" stroke-width="18"/>

  <!-- the little hour: 12 to 1, softly filled and lit on the track -->
  <path d="M128 128 L128 69 A59 59 0 0 1 157.5 76.9 Z" fill="url(#amber)" fill-opacity=".22"/>
  <path d="M128 50 A78 78 0 0 1 167 60.45" fill="none" stroke="#ff9e64" stroke-width="18" stroke-linecap="round" filter="url(#glow)" opacity=".8"/>
  <path d="M128 50 A78 78 0 0 1 167 60.45" fill="none" stroke="url(#amber)" stroke-width="18" stroke-linecap="round"/>

  <!-- hour marks -->
  <g fill="#414868">
    <circle cx="174.77" cy="101" r="4"/><circle cx="182" cy="128" r="4"/><circle cx="174.77" cy="155" r="4"/>
    <circle cx="155" cy="174.77" r="4"/><circle cx="128" cy="182" r="4"/><circle cx="101" cy="174.77" r="4"/>
    <circle cx="81.23" cy="155" r="4"/><circle cx="74" cy="128" r="4"/><circle cx="81.23" cy="101" r="4"/>
    <circle cx="101" cy="81.23" r="4"/>
  </g>

  <!-- one hand, resting at the end of the hour -->
  <line x1="128" y1="128" x2="148" y2="93.36" stroke="#e6e9f5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="10" fill="url(#amber)"/>
  <circle cx="128" cy="128" r="3.5" fill="#16161e"/>
</svg>
