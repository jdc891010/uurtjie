# Mutation testing for the release tooling (scripts/changelog.py). CI: .github/workflows/ci.yml › mutation.
#   pip install mutmut==3.8.0 pytest && mutmut run && mutmut results
#
# 11 surviving mutants are known equivalent (no input can tell them apart); CI allows exactly that many:
#   "\x1E"/"\x1F" for "\x1e"/"\x1f" (same characters), git(check=False -> None/omitted),
#   lstrip(None / "XX\nXX") on a record that starts with a hex sha, unlink(missing_ok) on a temp file that
#   always exists, `<` -> `<=` in add_section (an equal version is already refused as a duplicate),
#   and the --notes-file help text.
[mutmut]
source_paths=scripts/changelog.py
pytest_add_cli_args_test_selection=scripts/tests/
also_copy=
    CHANGELOG.md
    uurtjie/
    omarchy-plugin/
    .github/
    .gitattributes
    .gitignore
    scripts/__init__.py
    scripts/release-notes.sh
    scripts/tests/
