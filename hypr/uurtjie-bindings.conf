# Uurtjie keybinds for Omarchy / Hyprland.
# Add to ~/.config/hypr/bindings.conf:  source = ~/.config/hypr/uurtjie-bindings.conf
# Check for clashes first with SUPER+K (Omarchy keybinding list) and adjust the chords.

# SUPER+ALT+T  timer: 1st press starts, 2nd press -> confirm stop -> description
bindd = SUPER ALT, T, Uurtjie timer, exec, ~/.local/bin/uurtjie-timer
# SUPER+ALT+S  today/week/month as a notification
bindd = SUPER ALT, U, Uurtjie status, exec, sh -c 'notify-send -a uurtjie Uurtjie "$(~/.local/bin/uurtjie status 2>&1)"'
# SUPER+ALT+Z  undo the last manual entry
bindd = SUPER ALT, Z, Uurtjie undo, exec, sh -c 'notify-send -a uurtjie Uurtjie "$(~/.local/bin/uurtjie undo 2>&1)"'
# Optional: typed one-line entries for back-filling ("y 2h review")
# bindd = SUPER ALT, A, Uurtjie quick add, exec, ~/.local/bin/uurtjie-quick

# Float the small popups, centred.
# Hyprland ≥ 0.53 rule syntax:
windowrule = match:class uurtjie\.(timer|quick), float on, size 560 200, center on
# Older Hyprland (pre-0.53) — use these instead:
# windowrule = float, class:^(uurtjie\.(timer|quick))$
# windowrule = size 560 200, class:^(uurtjie\.(timer|quick))$
# windowrule = center, class:^(uurtjie\.(timer|quick))$
